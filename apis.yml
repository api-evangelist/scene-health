aid: scene-health
name: Scene Health
description: 'Scene Health (formerly emocha Mobile Health, founded 2008 out of Johns
  Hopkins and rebranded in 2022) is a Maryland-based digital health company tackling
  medication nonadherence. Its MedEngagement platform pairs a patient mobile app with
  a human care team of pharmacists, nurses and health coaches: members record daily
  video check-ins of themselves taking their medication — a scaled, asynchronous form
  of Directly Observed Therapy — and the care team reviews each dose, captures side
  effects and symptoms, and works barriers such as cost, transportation and social
  determinants of health. Scene sells to health plans and Medicaid MCOs, health systems,
  public health departments, employers, and research and clinical-trial organizations,
  with programs covering hypertension, diabetes, asthma, tuberculosis, HIV, hepatitis
  C, sickle cell disease, opioid use disorder and transplant care. The company raised
  a $17.7M Series B in March 2023 led by ABS Capital Partners. Scene operates as a
  HIPAA Business Associate and maintains a SOC 2 Type 2 attestation audited by A-LIGN
  across all five trust services criteria. It publishes no public developer program,
  API documentation or machine-readable API contract; its software surface is the
  member and care-team application at app.emocha.com.'
